function fix(s){const b=blank();for(const k in b){if(s[k]==null)s[k]=b[k]}for(const k in b.school){if(s.school[k]==null)s.school[k]=b.school[k]}if(!s.plan.sem1)s.plan.sem1={};if(!s.plan.sem2)s.plan.sem2={};
  if(!s._mig2){const old=['visit','goals','half','idp','final','int'];['sem1','sem2'].forEach(sm=>Object.entries(s.plan[sm]||{}).forEach(([tid,p])=>{const n=s.splan[tid]=s.splan[tid]||{prop:'',act:'',note:'',ovr:{}};
    if(!n.prop&&p.prop)n.prop=p.prop;if(!n.act&&p.act)n.act=p.act;if(!n.note&&p.note)n.note=p.note;(p.chk||[]).forEach((v,k)=>{if(v&&old[k]&&old[k]!=='visit')n.ovr[old[k]]=1})}));s._mig2=1}
  if(V1DB&&!s._v1db){const tk=n=>norm(n).split(' ');const match=n=>{const a=norm(n);let t=s.teachers.find(x=>norm(x.name)===a);if(t)return t;const p=tk(n);
      let c=s.teachers.filter(x=>{const q=tk(x.name);return q[0]===p[0]&&q[q.length-1]===p[p.length-1]});if(c.length===1)return c[0];
      c=s.teachers.map(x=>[x,tk(x.name).filter(w=>w.length>2&&p.includes(w)).length]).filter(z=>z[1]>=3).sort((u,v)=>v[1]-u[1]);return c.length&&(c.length===1||c[0][1]>c[1][1])?c[0][0]:null};
    s.visits=[];V1DB.forEach(o=>{const t=match(o.name);if(!t)return;const v=clone(o);delete v.name;v.tid=t.id;s.visits.push(v)});s._v1db=1;delete s._oldv}
  if(!s.cal.t1)s.cal.t1=[];if(!s.cal.t2)s.cal.t2=[];if(!s.orient.rows)s.orient.rows={};return s}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.teachers)return fix(x)}catch(e){}return fix(SEED?clone(SEED):blank())}

const tName = id => (T(id)||{}).name || '';
function sortedTeachers(filterRole){return S.teachers.filter(t=>!filterRole||t.role===filterRole).slice().sort((a,b)=>(a.order||0)-(b.order||0))}
function roleOf(spec){spec=spec||'';if(/وكيل/.test(spec))return 'وكيل';if(/موجه|مرشد/.test(spec))return 'موجه طلابي';if(/رائد/.test(spec))return 'رائد نشاط';if(/مختبر/.test(spec))return 'محضر مختبر';if(/إدارة|ادارة|مكتبة|مصادر|سكرتير|إداري/.test(spec))return 'إداري';return 'معلم'}
function intTypeOf(t){if(!t)return 'teacher';return {'محضر مختبر':'lab','موجه طلابي':'counselor','وكيل':'deputy','رائد نشاط':'activity'}[t.role]||'teacher'}
function tSelect(id, cur, onchange, opts={}){
  let h=`<select id="${id}" onchange="${onchange}">`;
  if(opts.empty)h+=`<option value="">${opts.empty}</option>`;
  const groups={};sortedTeachers(opts.role).forEach(t=>{(groups[t.role]=groups[t.role]||[]).push(t)});

function tNav(page, cur, extra='', role){ // teacher selector with prev/next

}

/* ---------- Hijri ---------- */
const _hf = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{year:'numeric',month:'numeric',day:'numeric'});
function isoToDate(iso){if(!iso)return null;const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d,12)}
function dateToIso(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')}
function hParts(dt){const p={};_hf.formatToParts(dt).forEach(x=>{if(x.type!=='literal')p[x.type]=parseInt(x.value)});return {y:p.year,m:p.month,d:p.day}}
function hStr(iso,short){if(!iso)return '';const dt=isoToDate(iso);if(!dt||isNaN(dt))return iso;const h=hParts(dt);return h.y+'/'+String(h.m).padStart(2,'0')+'/'+String(h.d).padStart(2,'0')+(short?'':'هـ')}
function dayName(iso){if(!iso)return '';return isoToDate(iso).toLocaleDateString('ar-SA',{weekday:'long'})}
function h2g(y,m,d){const jd=Math.floor((11*y+3)/30)+354*y+30*m-Math.floor((m-1)/2)+d+1948440-385;let ms=(jd-2440587.5)*864e5;let dt=new Date(ms);dt=new Date(dt.getUTCFullYear(),dt.getUTCMonth(),dt.getUTCDate(),12);
  for(let k=0;k<8;k++){const h=hParts(dt);const diff=(y-h.y)*354+(m-h.m)*29.5+(d-h.d);if(Math.abs(diff)<0.5)return dt;dt=new Date(dt.getTime()+Math.round(diff)*864e5)}
  for(let k=-3;k<=3;k++){const t=new Date(dt.getTime()+k*864e5);const h=hParts(t);if(h.y===y&&h.m===m&&h.d===d)return t}return dt}
function hMonthLen(y,m){const dt=h2g(y,m,30);const h=hParts(dt);return (h.m===m&&h.d===30)?30:29}
const todayIso = () => dateToIso(new Date());
function addDays(iso,n){const d=isoToDate(iso);d.setDate(d.getDate()+n);return dateToIso(d)}
function isHolWeek(w){return !!w&&(w.off||[]).filter(Boolean).length===5}
function wkNums(W){let n=0;return (W||[]).map(w=>isHolWeek(w)?null:++n)}
function yrStart(){const a=(S.cal.t1||[])[0];return (a&&a.start)||S.school.sem1||''}
function isCurY(v){if(v.py)return false;const y=yrStart();return !v.date||!y||v.date>=addDays(y,-21)}
function calWeeks(){const a=wkNums(S.cal.t1),b=wkNums(S.cal.t2);return [...(S.cal.t1||[]).map((w,i)=>({...w,t:1,n:a[i]})),...(S.cal.t2||[]).map((w,i)=>({...w,t:2,n:b[i]}))].filter(w=>w.start)}
function weekRow(iso){const W=calWeeks();for(const w of W){const e=addDays(w.start,6);if(iso>=w.start&&iso<=e)return w}return null}
function isSchoolDay(iso){const wd=isoToDate(iso).getDay();if(wd>4)return false;const W=calWeeks();if(!W.length)return true;const st=W.map(w=>w.start).sort();if(iso<st[0]||iso>addDays(st[st.length-1],6))return true;const w=weekRow(iso);return !!w&&!(w.off&&w.off[wd])}
function nextSchoolDay(iso,limit=400){let x=iso;for(let k=0;k<limit&&!isSchoolDay(x);k++)x=addDays(x,1);return x}
function termOf(iso){const t2=(S.cal.t2||[])[0];const s2=t2&&t2.start||S.school.sem2;return s2&&iso>=s2?2:1}
function weekOf(iso){const w=weekRow(iso);if(w)return w.n||'';const sems=[S.school.sem2,S.school.sem1].filter(Boolean).sort().reverse();for(const s of sems){if(iso>=s){const a=isoToDate(s),b=isoToDate(iso);const sun=new Date(a);sun.setDate(a.getDate()-a.getDay());return Math.floor((b-sun)/864e5/7)+1}}return ''}

  const yrs=[];for(let y=h.y-3;y<=h.y+3;y++)yrs.push(y);

   <select id="hpD">${Array.from({length:30},(_,i)=>`<option ${i+1===h.d?'selected':''}>${i+1}</option>`).join('')}</select>

   <select id="hpY" onchange="hpUpd()">${yrs.map(y=>`<option ${y===h.y?'selected':''}>${y}</option>`).join('')}</select></div>
   <p class="mu" id="hpG" style="text-align:center"></p>
   <div class="btns"><button class="btn" id="hpOk">اعتماد</button><button class="btn s" id="hpT">اليوم</button><button class="btn s" id="hpC">مسح</button><button class="btn s" onclick="closeModal()">إلغاء</button></div>`);
  const set=v=>{el.dataset.iso=v;el.value=v?hStr(v):'';closeModal();if(onch)new Function('iso','el',onch).call(el,v,el)};
  window.hpUpd=()=>{const y=+$('#hpY').value,m=+$('#hpM').value;const n=hMonthLen(y,m);const dSel=$('#hpD');const cur=Math.min(+dSel.value,n);dSel.innerHTML=Array.from({length:n},(_,i)=>`<option ${i+1===cur?'selected':''}>${i+1}</option>`).join('');showG()};
  const showG=()=>{const g=h2g(+$('#hpY').value,+$('#hpM').value,+$('#hpD').value);$('#hpG').textContent=g.toLocaleDateString('ar-SA',{weekday:'long'})+' — الموافق '+dateToIso(g).split('-').reverse().join('/')+'م'};
  $('#hpD').onchange=showG;hpUpd();
  $('#hpOk').onclick=()=>set(dateToIso(h2g(+$('#hpY').value,+$('#hpM').value,+$('#hpD').value)));

}

/* ---------- calculations ---------- */
const MID={5:95,4:85,3:75,2:65,1:50};
function pcOf(sc,pc){if(sc===''||sc==null||isNaN(sc)||+sc<1)return null;const l=+sc;const p=pc!=null&&pc!==''?+pc:NaN;const [lo,hi]=BANDS[l];return (!isNaN(p)&&p>=lo&&p<=hi)?p:MID[l]}
function formOf(e){return FORMS[(e&&e.form)||'teacher']||FORMS.teacher}
function stdCalc(sc,s,pc){if(typeof s==='number')s=C.stds[s];let n=0,sum=0,ps=0;(sc||[]).slice(0,s.ind.length).forEach((x,j)=>{if(x===''||x==null||isNaN(x)||+x<1)return;n++;sum+=+x;ps+=pcOf(x,pc&&pc[j])});
  if(!n)return null;const avg=sum/n,pct=ps/n,score=pctBand(pct);return {avg,pct,score,wtd:score*s.w,full:n===s.ind.length}}
function evalCalc(e){if(!e||!e.sc)return null;let g=0,n=0,full=true,pw=0,ws=0;const F=formOf(e);const per=F.stds.map((s,i)=>{const r=stdCalc(e.sc[i],s,e.pc&&e.pc[i]);if(r){g+=r.wtd;pw+=r.pct*s.w;ws+=s.w;n++;if(!r.full)full=false}else full=false;return r});
  if(!n)return null;return {per,grade:g,pct:pw/ws,full,n,stds:F.stds,form:e.form||'teacher'}}
function getEval(tid,period){const e=(S.evals[tid]||{})[period];return evalCalc(e)}
function bestEval(tid){return getEval(tid,'final')?{p:'final',c:getEval(tid,'final')}:(getEval(tid,'half')?{p:'half',c:getEval(tid,'half')}:null)}
function classOf(g){if(g==null||isNaN(g))return '';return CLASSES[5-classLvl(g)][1]}
function classLvl(g){if(g==null||isNaN(g))return 0;return Math.max(1,Math.min(5,Math.floor(+g+0.5)))}
function recOf(score){if(score==null||score===''||isNaN(score))return '';return C.recs[classLvl(+score)-1]}
const BANDS={5:[90,100],4:[80,89],3:[70,79],2:[60,69],1:[0,59]};
function bandTxt(v){const l=classLvl(v);if(!l)return '';return l===1?'أقل من 60%':'من '+BANDS[l][0]+'% إلى '+BANDS[l][1]+'%'}
function pctEst(v){if(v==null||isNaN(v))return null;v=Math.max(1,Math.min(5,+v));const l=classLvl(v);if(l===1)return null;const [lo,hi]=BANDS[l];const a=l===5?(v-4.5)/0.5:(v-(l-0.5));return Math.round(lo+Math.max(0,Math.min(1,a))*(hi-lo))}
function evLvl(c){return c&&c.grade!=null?classLvl(c.grade):0}
function evCls(c){const l=evLvl(c);return l?CLASSES[5-l][1]:''}
function recOfR(r){return r?recOf(r.score):''}
function pctBand(p){if(p==null)return 0;return p>=90?5:p>=80?4:p>=70?3:p>=60?2:1}
const pf0=p=>p==null||isNaN(p)?'':(Math.round(p*10)/10)+'%';
function pctTxt(v){const e=pctEst(v);return e==null?bandTxt(v):'نحو '+e+'% ('+bandTxt(v)+')'}

/* ===== توليد النصوص ===== */
function hashN(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h}
function weakInds(e,i,maxN){const s=formOf(e).stds[i];const L=s.ind.map((x,j)=>({j,sc:e.sc[i][j],p:pcOf(e.sc[i][j],e.pc&&e.pc[i]&&e.pc[i][j])})).filter(x=>x.p!=null);
  if(!L.length)return [];const lo=Math.min(...L.map(x=>x.p));L.sort((a,b)=>a.p-b.p||a.j-b.j);
  const w=L.filter(x=>x.p<=lo+5);return (w.length?w:L).slice(0,maxN)}
function targetTxt(s){if(s>=5)return '';const t=[s+1];if(s+2<=5)t.push(s+2);return 'الهدف: الانتقال من الدرجة ('+s+') إلى ('+t[0]+')'+(t[1]?' ثم إلى ('+t[1]+')':'')}
function initTxt(s){const t=[];if(s<4&&s+2>=4)t.push('تقديم مبادرات جديدة للوصول إلى الدرجة (4)');if(s<5&&s+2>=5)t.push('تقديم مبادرات نوعية للوصول إلى الدرجة (5)');return t}
function elemRec(tid,per,i){const e=(S.evals[tid]||{})[per];if(!e)return '';const st=formOf(e).stds[i];const r=stdCalc(e.sc[i],st,e.pc&&e.pc[i]);if(!r)return '';
  if(r.score>=5)return 'أداء مثالي في هذا المعيار؛ يُوصى بالمحافظة عليه، وتقديم مبادرات نوعية، ونشر التجربة بين الزملاء.';
  const w=weakInds(e,i,r.score<=2?2:1);const parts=w.map(x=>stdLib(st,x.j,e.form).r);
  return targetTxt(r.score)+'، بالتركيز على: '+parts.join('؛ و')+(initTxt(r.score).length?'، مع '+initTxt(r.score).join(' و'):'')+'.'}
function idpTime(tid,per){const e=(S.evals[tid]||{})[per]||{};const d=e.date||todayIso();return (per==='final'||termOf(d)===2)?'الفترة الدراسية الثانية':'الفترة الدراسية الأولى والثانية'}
function idpAuto(tid){const b=bestEval(tid);if(!b)return [];const e=S.evals[tid][b.p];const F=formOf(e),SS=F.stds;const time=idpTime(tid,b.p);const out=[];
  const order=b.c.per.map((r,i)=>({r,i})).filter(x=>x.r&&x.r.score<5).sort((a,c)=>a.r.score-c.r.score||a.r.pct-c.r.pct);
  order.forEach(({r,i})=>{if(out.length>=8)return;weakInds(e,i,r.score<=2?2:1).forEach(x=>{if(out.length>=8)return;const L=stdLib(SS[i],x.j,e.form);const seed=hashN(tid+i+'-'+x.j);
    const GR=F.gen||GEN_REQ;const gen=GR[seed%GR.length];const req=[...new Set([L.q[seed%L.q.length],L.q[(seed+1)%L.q.length],gen])];
    out.push({std:SS[i].name,step:L.s,time,req:req.join('، ')})});
    if(r.score>=3&&out.length<8){const it=initTxt(r.score);if(it.length)out.push({std:SS[i].name,step:it[it.length-1].replace('تقديم','تصميم وتنفيذ')+' في عنصر «'+SS[i].name+'»',time,req:['مبادرات مبتكرة',(F.gen||GEN_REQ)[(hashN(tid+i)+3)%(F.gen||GEN_REQ).length],'تقارير تفصيلية'].filter((v,k,a)=>a.indexOf(v)===k).join('، ')})}});
  if(!out.length)out.push({std:'',step:F.share,time,req:F.shareReq});
  out.push({std:'',step:'توثيق الشواهد في ملف الإنجاز ومتابعة تقدم الخطة مع '+F.sup,time,req:'ملف الشواهد، تقارير تفصيلية، صور من أرض الواقع'});return out}
function idpGoalsAuto(tid){const b=bestEval(tid);if(!b)return {g:[{},{},{}],dev:[{},{},{},{},{}]};const e=S.evals[tid][b.p];const F=formOf(e),SS=F.stds;
  const order=b.c.per.map((r,i)=>({r,i})).filter(x=>x.r).sort((a,c)=>a.r.score-c.r.score||a.r.pct-c.r.pct);
  const g=order.slice(0,3).map(({r,i})=>{const w=weakInds(e,i,1)[0];const L=stdLib(SS[i],w?w.j:0,e.form);const sd=hashN(tid+i);const nm=SS[i].name;
    const G2=F.g20||GOAL20,G1=F.g10||GOAL10;return {a:L.s,b:G2[sd%G2.length]+' '+nm,c:G1[(sd>>3)%G1.length]+' '+nm}});while(g.length<3)g.push({});
  const dev=order.slice(0,5).map(({r,i})=>{const w=weakInds(e,i,1)[0];const L=stdLib(SS[i],w?w.j:0,e.form);const s=r.score;const nm=SS[i].name;
    return {goal:s>=5?'المحافظة على المستوى المثالي في '+nm:'رفع مستوى الأداء في «'+nm+'» من ('+s+') إلى ('+Math.min(5,s+1)+')',acts:'70%: '+L.s+' — 20%: '+(F.g20||GOAL20)[hashN(nm)%(F.g20||GOAL20).length]+' '+nm+' — 10%: '+(F.g10||GOAL10)[hashN(nm+tid)%(F.g10||GOAL10).length]+' '+nm,end:'نهاية '+(idpTime(tid,b.p).includes('الأولى')?'الفترة الدراسية الأولى':'الفترة الدراسية الثانية'),sup:F.sup,proc:L.q.join('، '),succ:'رفع نسبة تحقق العنصر إلى '+BANDS[Math.min(5,s+1)][0]+'% فأكثر'}});
  while(dev.length<5)dev.push({});return {g,dev}}
function visitSupport(v){const t=T(v.tid)||{name:''};let out='أشكر الأستاذ/ '+t.name+' على جهوده في المدرسة.';
  const doms={};C.els.forEach((e,i)=>{if((v.el[i]||[])[0]===1)(doms[e[0]]=doms[e[0]]||[]).push(EL_PRAISE[i])});
  const tl=C.tools.map((x,i)=>(v.tools[i]||[])[0]===1?TOOL_PRAISE[i]:null).filter(Boolean);
  const dk=Object.keys(doms);
  if(dk.length){out+='\nوقد لمستُ خلال الزيارة تميّزه '+dk.map(d=>DOM_PRAISE[d]+' من خلال: '+doms[d].join('، ')).join('؛ و')+'.'}
  if(tl.length)out+='\nكما أثمّن حرصه على: '+tl.join('، ')+'.';
  if(dk.length||tl.length)out+='\nمتمنياً له دوام التميز والعطاء.';
  return out}
function visitRecs(v){const L=[];
  C.els.forEach((e,i)=>{if((v.el[i]||[])[0]===3)L.push(EL_REC[i][0])});
  C.tools.forEach((e,i)=>{if((v.tools[i]||[])[0]===4)L.push(TOOL_REC[i][0])});
  const mid=[];C.els.forEach((e,i)=>{if((v.el[i]||[])[0]===2)mid.push(EL_REC[i][1])});
  C.tools.forEach((e,i)=>{if((v.tools[i]||[])[0]===3)mid.push(TOOL_REC[i][1])});
  L.push(...mid.slice(0,Math.max(3,8-L.length)));
  const any=v.el.some(e=>e[0])||v.tools.some(e=>e[0]);if(!any)return '';
  if(!L.length)return 'الاستمرار على هذا المستوى المتميز، ونقل التجربة إلى الزملاء بتقديم درس تطبيقي أو مبادرة نوعية.';
  return 'نوصي بما يلي:\n'+L.map((x,k)=>(k+1)+'- '+x+'.').join('\n')+'\nمع متابعة تنفيذ التوصيات في الزيارة القادمة.'}
const joinTxt=(a,b)=>[a,b].filter(x=>x&&String(x).trim()).join('\n');

  SP('تهيئة وتسليم الأجهزة المطلوبة للمعلمين وتخزينها بطريقة سليمة',.05,['إعداد وتنظيم الأجهزة والمواد التعليمية المطلوبة لتنفيذ الدرس العملي، والتأكد من صلاحيتها للاستخدام، وتسليمها للمعلمين في الوقت المناسب، واستلامها منهم، والتأكد من نظافتها وتخزينها في المكان المناسب.'],{r:'تسليم الأجهزة للمعلمين في الوقت المناسب واستلامها وتخزينها بصورة سليمة',s:'تفعيل سجل تسليم واستلام الأجهزة مع فحص الصلاحية قبل التسليم',q:['سجل التسليم والاستلام','بطاقات الأجهزة','تقارير تفصيلية']}),
  SP('يُعد تقرير أنشطة ومهام المختبر الأسبوعية',.10,['إعداد تقارير أسبوعية لأهم الأنشطة والمهام التي سيتم إقامتها في المختبرات، وتوضيح أهم التحديات، وتنظيم السجلات والملفات الخاصة بالمعامل والمختبرات، وتدوين البيانات والمعلومات عن موجوداتها، وتحديثها وفقًا للإجراءات المعتمدة.'],{r:'إعداد تقرير أسبوعي منتظم لأنشطة المختبر وتحدياته وتحديث سجلاته',s:'إعداد نموذج تقرير أسبوعي موحد ورفعه لوكيل الشؤون التعليمية نهاية كل أسبوع',q:['نموذج التقرير الأسبوعي','سجلات المختبر','تقارير تفصيلية']}),
  SP('يُعد تقارير دورية عن حالة الأجهزة والمعدات',.10,['إعداد تقارير دورية توضح حالة الأدوات والأجهزة والمعدات، وتحديد مدى حاجتها للصيانة، ورفعها للمختصين ومتابعتها.'],{r:'رصد حالة الأجهزة دورياً ورفع احتياجات الصيانة ومتابعتها',s:'إعداد تقرير شهري بحالة الأجهزة والمعدات واحتياجات الصيانة ومتابعة تنفيذها',q:['نموذج حالة الأجهزة','طلبات الصيانة','تقارير تفصيلية']})];

  SP('يُقدم التدخلات المناسبة لتعزيز الانضباط',.05,['تقديم برامج وممارسات داعمة للانضباط المدرسي.'],{r:'تقديم تدخلات تربوية للمتأخرين صباحاً ومتكرري الغياب وقياس أثرها',s:'حصر متكرري التأخر والغياب وتنفيذ برنامج انضباط فردي وجماعي وقياس أثره',q:['سجل الغياب والتأخر','الأدلة الإرشادية','تقارير تفصيلية']}),
  SP('تقديم برامج تربوية لتعزيز دافعية الطلبة للتعلم',.05,['تقديم برامج نوعية لتنمية مهارات واتجاهات الطلبة نحو التعلم وفق خصائص النمو لكل مرحلة، مع التنويع في أساليب تنفيذ البرامج التي تُنمّي مهارات واتجاهات الطلبة نحو التعلم.'],{r:'تنفيذ برامج متنوعة لتعزيز دافعية الطلاب مبنية على دراسة واقعهم',s:'تنفيذ برنامج تحفيزي (لقاءات، مبادرات، متابعة فردية) لرفع دافعية الطلاب',q:['دراسة واقع الطلاب','لقاءات إرشادية','مبادرات مبتكرة']}),
  SP('إعداد خُطة لبرامج التوجيه الطلابي',.10,['تصميم خُطة للبرامج مكتملة العناصر، ومبنية على معلومات وتحليل لواقع العمل الفعلي.'],{r:'إعداد خطة توجيه طلابي مكتملة العناصر مبنية على تحليل الواقع',s:'تحليل واقع الطلاب وبناء خطة التوجيه الطلابي وعرضها على لجنة التوجيه',q:['دليل التوجيه الطلابي','نموذج الخطة','محضر لجنة التوجيه']}),
  SP('يُصنف الحالات ويُقدم برامج الدعم المناسبة',.10,['تقديم برامج نوعية بناءً على تصنيف حالات الطلبة، والبرامج المناسبة لكل فئة.'],{r:'تصنيف حالات الطلاب وتقديم برامج دعم مناسبة لكل فئة',s:'تصنيف الحالات في سجل موحد وإعداد برنامج دعم لكل فئة ومتابعة تقدمها',q:['سجل الحالات','برامج الدعم','تقارير تفصيلية']}),
  SP('يُعزز القيم والسلوكيات للمتعلمين',.10,['تزويد الطلبة ومنسوبي المدرسة بالقيم والسلوكيات الإيجابية، والعمل على تعزيزها.'],{r:'تعزيز القيم والسلوك الإيجابي ببرامج مستمرة لجميع منسوبي المدرسة',s:'تنفيذ برنامج قيمي شهري بالتعاون مع المعلمين والإذاعة المدرسية',q:['الإذاعة المدرسية','لوحات القيم','مبادرات مبتكرة']}),
  SP('يُقدم التدخلات النفسية والاجتماعية',.10,['استخدام استراتيجيات فنية فعالة للوقاية والحد من المشكلات النفسية والاجتماعية للطلبة (المقابلة - دراسة الحالة - التوجيه الجمعي - التحويل للجهات ذات العلاقة - الرعاية الطلابية) ويمارس التدخل الفردي والجمعي.'],{r:'تطبيق أساليب التدخل الفردي والجمعي ودراسة الحالة بفاعلية',s:'تنفيذ دراسات حالة ومقابلات فردية وجلسات توجيه جمعي ومتابعة نتائجها',q:['نماذج دراسة الحالة','سجل المقابلات','التحويل للجهات المختصة']}),
  SP('يُساعد المتعلمين على التخطيط المهني والتعليمي',.05,['تنفيذ برامج التوجيه التعليمي والمهني وفق الأدلة المنظمة لذلك، وتطبيق مقاييس الميول والاتجاهات؛ لاكتشاف قدرات الطلبة وميولهم وتوجيههم للتخصصات المناسبة.'],{r:'تنفيذ برامج التوجيه التعليمي والمهني وتطبيق مقاييس الميول',s:'تطبيق مقياس الميول المهنية وتنفيذ لقاءات تعريفية بالتخصصات والمسارات',q:['مقاييس الميول','لقاءات مهنية','تقارير تفصيلية']}),
  SP('يُعزز التفوق الدراسي',.05,['تقديم برامج وممارسات نوعية بناءً على تحليل نتائج الطلبة وتحديد مستواهم؛ لتعزيز المتفوقين وتحفيز التفوق لدى بقية الطلبة.'],{r:'تقديم برامج نوعية للمتفوقين مبنية على تحليل النتائج',s:'حصر المتفوقين وتنفيذ برنامج رعاية وتكريم دوري لهم',q:['تحليل النتائج','شهادات تكريم','مبادرات مبتكرة']}),
  SP('يُقدم تدخلات تربوية للمتأخرين دراسياً والمعيدين',.05,['تقديم برامج وممارسات مناسبة بناءً على نتائج تحليل الطلاب؛ للرفع من مستوى التحصيل الدراسي لدى الطلبة.'],{r:'تنفيذ تدخلات تربوية للمتأخرين دراسياً والمعيدين ومتابعة تحسنهم',s:'إعداد خطط علاجية بالتعاون مع المعلمين للمتأخرين دراسياً ومتابعتها شهرياً',q:['خطط علاجية','التنسيق مع المعلمين','تقارير تفصيلية']}),
  SP('توعية المتعلمين وأولياء أمورهم بقواعد السلوك والمواظبة',.05,['نشر قواعد السلوك والمواظبة في المجتمع المدرسي والمحلي.'],{r:'نشر قواعد السلوك والمواظبة بين الطلاب وأولياء الأمور',s:'تنفيذ حملة توعوية بقواعد السلوك والمواظبة عبر اللقاءات والرسائل',q:['قواعد السلوك والمواظبة','رسائل أولياء الأمور','مطويات توعوية']})];

  D('مرن وقادر على تنفيذ أعماله في ظل ظروف العمل المختلفة',.05,['يتكيف مع الظروف والمستجدات ويُنجز مهامه بفاعلية تحت الضغط ويتقبل التغيير في متطلبات العمل.'],'رفع المرونة في إنجاز المهام في الظروف المختلفة وإدارة الأولويات','إعداد خطة بديلة للمهام الحرجة وتطبيق إدارة الأولويات أسبوعياً',['إدارة الوقت','خطط بديلة','تقارير تفصيلية']),
  D('يدعم ويشارك في المبادرات النوعية',.10,['يدعم ويشارك في التجارب والمشروعات الواردة في مجال تخصصه الإشرافي.','يُقوّم التجارب والمشروعات الواردة من المدارس.','يُعد تقارير حول التجارب والمشروعات القابلة للتطبيق في الميدان التربوي.','يُسهم في نشر التجارب والمشروعات المتميزة في الميدان.','يُوظف التقنية في التواصل، ومتابعة ونشر التجارب والمشروعات.','يبتكر حلولاً إبداعية ومبادرات إيجابية ومشاريع تربوية وفق منهجية علمية مقننة.'],'دعم المبادرات النوعية وابتكار حلول ومشاريع تربوية ونشرها','تبنّي مبادرة نوعية في المدرسة ومتابعة تنفيذها وقياس أثرها ونشرها',['مبادرات مبتكرة','منصات التواصل','تقارير تفصيلية']),
  D('يتخذ إجراءات تربوية تُحقق الانضباط المدرسي',.05,['يطبق قواعد السلوك والمواظبة ويتخذ إجراءات تربوية تحقق الانضباط المدرسي.'],'تطبيق قواعد السلوك والمواظبة بإجراءات تربوية تحقق الانضباط','متابعة الحضور والانصراف يومياً وتطبيق إجراءات قواعد السلوك والمواظبة',['قواعد السلوك والمواظبة','نظام نور','تقارير تفصيلية']),
  D('يُدير الموارد في المدرسة بكفاءة',.05,['يُدير الموارد البشرية والمادية في المدرسة بكفاءة وفاعلية.'],'إدارة الموارد البشرية والمادية بكفاءة وترشيد استخدامها','حصر موارد المدرسة وإعداد خطة لتوظيفها ومتابعة الاستفادة منها',['سجل العهد','خطة الموارد','تقارير تفصيلية']),
  D('يُشارك في إعداد خطة للتطوير المهني',.05,['يُساعد المعلمين على وضع أهداف واضحة لتطوير الأداء المهني المستمر وفق احتياجاتهم في ضوء المعايير المهنية.','يُحلل مخرجات تقييم الأداء للمعلمين ويحدد نقاط القوة وجوانب التطوير.','يضع خططاً للتطوير بالتشارك مع المعنيين بالميدان التعليمي.'],'المشاركة في بناء خطة التطوير المهني بناءً على تحليل احتياجات المعلمين','تحليل نتائج تقييم المعلمين وبناء خطة تطوير مهني مدرسية بالتشارك معهم',['تحليل نتائج التقييم','استبانة الاحتياجات التدريبية','خطة التطوير المهني']),
  D('يُقدم التغذية الراجعة ويتابع تحقق مؤشرات الأداء الوظيفي',.05,['مراجعة أداء الفترة السابقة وقياس نسبة التقدم الذي أحرزه شاغل الوظيفة التعليمية، ومناقشة التحديات والاتفاق على إجراءات تدعم تحقيق المستهدفات، وتعزيز السلوكيات الفعّالة.'],'تقديم تغذية راجعة دورية ومتابعة تحقق مؤشرات الأداء','عقد لقاءات متابعة دورية مع المعلمين لمراجعة مؤشرات الأداء وتقديم التغذية الراجعة',['نماذج المتابعة','محاضر اللقاءات','تقارير تفصيلية']),
  D('يدعم تنفيذ برامج التطوير المهني',.05,['يدعم تنفيذ برامج التطوير المهني للمستهدفين ويُقيّمها ويُطورها.','يُرشح المعلمين للالتحاق بالبرامج التدريبية ويُقدم تغذية راجعة بناءة.','يُقوّم البرامج التدريبية ويقيس أثرها.','يُعد ملفات الإنجاز بنوعيها الورقي والإلكتروني ويوظفها لمتابعة أداء المعلمين.'],'دعم تنفيذ البرامج التدريبية وقياس أثرها على الأداء','تنفيذ برامج تدريبية داخل المدرسة ومتابعة انتقال أثرها إلى الصف',['مجتمعات التعلم المهنية','نماذج قياس الأثر','ملفات الإنجاز']),
  D('يُقيّم أداء منسوبي المدرسة',.05,['يُقوّم أداء مرؤوسيه بأساليب علمية استناداً على مصادر التقويم الوظيفي وأدواته.','يستخدم أدوات متنوعة في عملية التقويم ويوظف نتائجها في تطوير الأداء التعليمي.','يُلاحظ أداء المرؤوسين (تخطيطاً وتنفيذاً وتقويماً).','يُشجع المرؤوسين على ممارسة التقويم الذاتي وتوظيفه في تحسين الأداء المهني.'],'تقويم أداء المنسوبين بأدوات علمية متنوعة وتوظيف النتائج','تطبيق أدوات تقويم متنوعة (زيارات، ملاحظة، ملف إنجاز) وتوثيق نتائجها',['استمارات الزيارة','ملف الشواهد','تقارير تفصيلية']),
  D('يُنفذ إجراءات علمية لتحسين نتائج التعلم',.05,['عملية منهجية تقوم على أسس علمية لتشخيص أداء المتعلمين، وتصنيف مستوياتهم، وتفسير النتائج التي تُساعد في توجيه القرار بهدف تقديم المعالجات التربوية.','رصد نمو المتعلمين دراسياً، وتنمية معارفهم ومهاراتهم، وتطوير عمليات التعليم والتعلم والتواصل مع أولياء الأمور.'],'تشخيص نتائج المتعلمين علمياً وبناء معالجات تربوية','تحليل نتائج الاختبارات على مستوى المدرسة وبناء خطط علاجية بالتعاون مع المعلمين',['برنامج تحليل النتائج','خطط علاجية','تقارير تفصيلية']),
  D('يُسهم في تحسين مستوى أداء المدرسة',.05,['يُسهم في رفع مؤشرات أداء المدرسة وتحقيق مستهدفاتها.'],'المساهمة في رفع مؤشرات أداء المدرسة وتحقيق مستهدفاتها','متابعة مؤشرات أداء المدرسة شهرياً وتنفيذ إجراءات لتحسين المتدني منها',['لوحة مؤشرات الأداء','خطة التحسين','تقارير تفصيلية']),
  D('يُشارك في إعداد الخطط المدرسية اللازمة',.05,['يُشارك في إعداد الخطط المدرسية من خلال إدارة الموارد والأنشطة، ويوجه الجهود نحو تحقيق استراتيجيات الوزارة.'],'المشاركة الفاعلة في إعداد الخطط المدرسية وفق استراتيجيات الوزارة','المشاركة في إعداد الخطة التشغيلية للمدرسة وتحديد مسؤوليات التنفيذ',['الخطة التشغيلية','نماذج التخطيط','محاضر الاجتماعات']),
  D('يُتابع تنفيذ الخطط المدرسية بمختلف أنواعها',.05,['يتابع تنفيذ الخطط المدرسية بمختلف أنواعها ويقيس مدى تحققها.'],'متابعة تنفيذ الخطط المدرسية وقياس مدى تحققها','إعداد جدول متابعة لتنفيذ الخطط المدرسية وقياس نسب الإنجاز فصلياً',['جدول المتابعة','مؤشرات الإنجاز','تقارير تفصيلية']),
  D('يُهيئ الفرص والإمكانات الداعمة لمشاركة الطلاب في الأنشطة الصفية وغير الصفية',.05,['يهيئ الفرص والإمكانات الداعمة لمشاركة الطلاب في الأنشطة الصفية وغير الصفية.'],'تهيئة الفرص والإمكانات لمشاركة الطلاب في الأنشطة','توفير احتياجات الأنشطة وتنظيم جدول زمني لمشاركة الطلاب فيها',['خطة النشاط','رائد النشاط','صور من أرض الواقع']),

/* قارئ xlsx مدمج (بدون إنترنت) */
async function unzipEntries(buf){const dv=new DataView(buf);let e=buf.byteLength-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('ملف غير صالح');
  const n=dv.getUint16(e+10,true);let o=dv.getUint32(e+16,true);const out={};const td=new TextDecoder();
  for(let i=0;i<n;i++){const method=dv.getUint16(o+10,true),csize=dv.getUint32(o+20,true),nl=dv.getUint16(o+28,true),xl=dv.getUint16(o+30,true),cl=dv.getUint16(o+32,true),lo=dv.getUint32(o+42,true);
    const name=td.decode(new Uint8Array(buf,o+46,nl));out[name]={method,csize,lo};o+=46+nl+xl+cl}
  out._read=async name=>{const f=out[name];if(!f)return null;const ln=dv.getUint16(f.lo+26,true),lx=dv.getUint16(f.lo+28,true);const data=new Uint8Array(buf,f.lo+30+ln+lx,f.csize);
    if(f.method===0)return td.decode(data);const ds=new DecompressionStream('deflate-raw');const s=new Blob([data]).stream().pipeThrough(ds);return await new Response(s).text()};return out}
async function readXlsx(buf){const z=await unzipEntries(buf);const P=new DOMParser();const ss=[];const sst=await z._read('xl/sharedStrings.xml');
  if(sst){const d=P.parseFromString(sst,'application/xml');[...d.getElementsByTagName('si')].forEach(si=>ss.push([...si.getElementsByTagName('t')].map(t=>t.textContent).join('')))}
  const wbx=P.parseFromString(await z._read('xl/workbook.xml'),'application/xml');const rels=P.parseFromString(await z._read('xl/_rels/workbook.xml.rels'),'application/xml');
  const relMap={};[...rels.getElementsByTagName('Relationship')].forEach(r=>relMap[r.getAttribute('Id')]=r.getAttribute('Target'));
  const sheets=[...wbx.getElementsByTagName('sheet')].map(s=>({name:s.getAttribute('name'),path:'xl/'+relMap[s.getAttribute('r:id')||s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')].replace(/^\/?xl\//,'')}));
  const res=[];for(const sh of sheets){const xml=await z._read(sh.path);if(!xml)continue;const d=P.parseFromString(xml,'application/xml');const rows=[];
    [...d.getElementsByTagName('row')].forEach(r=>{const row=[];[...r.getElementsByTagName('c')].forEach(c=>{const ref=c.getAttribute('r')||'';const col=ref.replace(/\d+/g,'').split('').reduce((a,ch)=>a*26+ch.charCodeAt(0)-64,0)-1;
      const t=c.getAttribute('t');const v=c.getElementsByTagName('v')[0];let val='';if(t==='s'&&v)val=ss[+v.textContent]||'';else if(t==='inlineStr')val=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');else if(v)val=v.textContent;row[col<0?row.length:col]=String(val).trim()});rows.push(row)});
    res.push({name:sh.name,rows})}return res}
function pickRows(sheets){let best=[];sheets.forEach(({name,rows})=>{rows=rows.map(r=>Array.from(r,x=>x||''));let hr=-1,ci={};
    for(let k=0;k<Math.min(rows.length,15);k++){const r=rows[k];const ni=r.findIndex(c=>/^(الاسم|اسم المعلم|اسم المنسوب|الإسم)/.test(c)||/اسم/.test(c));if(ni>=0){hr=k;ci.n=ni;r.forEach((c,j)=>{if(/تخصص|العمل/.test(c))ci.s=j;else if(/فئة/.test(c))ci.r=j;else if(/هوية|سجل/.test(c))ci.i=j;else if(/جوال|هاتف/.test(c))ci.p=j});break}}
    let out;if(hr>=0)out=rows.slice(hr+1).map(r=>[r[ci.n],ci.s!=null?r[ci.s]:r[ci.n+1],ci.r!=null?r[ci.r]:'',ci.i!=null?r[ci.i]:'',ci.p!=null?r[ci.p]:'']).filter(r=>r[0]&&!/^=/.test(r[0])&&!/^\d+$/.test(r[0]));
    else out=rows.filter(r=>r[0]&&/[؀-ۿ]/.test(r[0])).map(r=>[r[0],r[1]||'']);
    if(/أسماء المعلمين|المنسوبون/.test(name)&&out.length)out._pri=1;if((out._pri&&!best._pri)||(out.length>best.length&&!best._pri))best=out});return best}
async function readTable(f){
  if(/\.(csv|txt)$/i.test(f.name)){const t=await f.text();return t.split(/\r?\n/).map(l=>l.split(/\t|,|;/)).filter(r=>r[0])}
  if(/\.(xlsx|xlsm)$/i.test(f.name)&&window.DecompressionStream){try{const r=pickRows(await readXlsx(await f.arrayBuffer()));if(r.length)return r}catch(e){console.warn(e)}}
  if(!window.XLSX){await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js').catch(()=>{throw new Error('تعذرت قراءة الملف. احفظه بصيغة xlsx أو CSV أو الصق الأسماء.')})}
  const wb=XLSX.read(await f.arrayBuffer());return pickRows(wb.SheetNames.map(n=>({name:n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false}).map(r=>Array.from(r,x=>String(x==null?'':x).trim()))})));
}

function idpGoals(tid){const p=idpOf(tid);const a=idpGoalsAuto(tid);const g=(p.g||[]).some(x=>x&&Object.values(x).some(Boolean))?p.g:a.g;const dev=(p.dev||[]).some(x=>x&&Object.values(x).some(Boolean))?p.dev:a.dev;return {g,dev}}

  else{h+=acts.map((a,i)=>`<div class="wrow"><div class="wrh"><b>${i+1}- ${esc(a.step)}</b></div>${a.std?`<div class="mu">المعيار: ${esc(a.std)}</div>`:''}<div class="mu">⏱️ ${esc(a.time)}</div><div style="font-size:13.5px;margin-top:4px">🧰 ${esc(a.req)}</div></div>`).join('')+`<div class="btns"><button class="btn s sm" onclick="_p.actions=clone(idpAuto(_pT));_p.custom=true;save();render()">✎ تعديل الخطة يدوياً</button></div>`}

   <div class="btns"><button class="btn s sm" onclick="confirmBox('استعادة المقترحات التلقائية للأهداف؟',()=>{delete _p.g;delete _p.dev;save();render()})">⚙️ استعادة المقترحات</button></div></div>`;
  setView('خطة التطوير الفردية IDP',h);

function idpEd(k,i,f,v){const p=_p;if(!p[k]||!p[k].some(x=>x&&Object.values(x).some(Boolean))){const gd=idpGoals(_pT);p.g=clone(gd.g);p.dev=clone(gd.dev)}p[k][i]=p[k][i]||{};p[k][i][f]=v;saveSoon()}

function intCriteria(type){return type==='teacher'?C.stds.map(s=>s.name):C.ints[type]}
function intScore(tid,type,i,crit){const b=bestEval(tid);if(!b)return null;const j=b.c.stds.findIndex(s=>norm(s.name)===norm(crit));if(j<0)return null;const r=b.c.per[j];return r?r.score:null}
PAGES.interview=function(tid){
  if(!tid){const f=sortedTeachers()[0];return f?go('interview/'+(window._lastT&&T(window._lastT)?window._lastT:f.id),1):setView('محاضر المقابلة','')}

  const t=T(tid);const it=S.interviews[tid]=S.interviews[tid]||{type:intTypeOf(t),date:'',rows:{}};window._it=it;window._itT=tid;

    <div class="row" style="margin-top:6px"><div class="chips" style="flex:0 0 auto" id="its${i}"><span class="chip wide ok ${r.st===1?'on':''}" onclick="itSt(${i},1)">أتم</span><span class="chip wide no ${r.st===2?'on':''}" onclick="itSt(${i},2)">لم يتم</span></div><input placeholder="الملاحظات" value="${esc(r.note||'')}" oninput="_it.rows[${i}].note=this.value;saveSoon()"></div></div>`});
  h+=`<div class="btns"><button class="btn s sm" onclick="crit_all(1)">الكل: أتم</button><button class="btn s sm" onclick="crit_all(2)">الكل: لم يتم</button></div></div><div class="btns"><button class="btn s" onclick="printDoc(sortedTeachers().filter(t=>t.role!=='إداري').map(t=>docInterview(t.id)).join(''))">🖨️ طباعة محاضر الجميع</button></div>`;

function itSt(i,v){const r=_it.rows[i];r.st=r.st===v?0:v;document.querySelectorAll('#its'+i+' .chip').forEach((e,k)=>e.classList.toggle('on',r.st===k+1));save()}

function isPick(i){const d=S.intSched[i];const other=new Set(S.intSched.filter((x,k)=>k!==i).flatMap(x=>x.tids));

function iaW(el){document.querySelectorAll('#iaW .chip').forEach(c=>c.classList.toggle('on',c===el))}
function isAuto(){openModal(`<h3>توزيع تلقائي للمقابلات</h3><label class="f">تاريخ أول يوم</label>${dateIn('iaS',nextSchoolDay(todayIso()),'')}<label class="f" style="margin-top:8px">المشمولون بالتوزيع</label><div class="chips" id="iaW"><span class="chip wide ok on" data-v="t" onclick="iaW(this)">المعلمون</span><span class="chip wide ok" data-v="a" onclick="iaW(this)">الإداريون</span><span class="chip wide ok" data-v="all" onclick="iaW(this)">الجميع</span></div><div class="row" style="margin-top:8px"><div><label class="f">عدد المنسوبين في اليوم</label><input type="number" id="iaN" value="12"></div><div><label class="f">الأيام</label><select id="iaD"><option value="all">كل أيام الأسبوع (الأحد-الخميس)</option><option value="0">الأحد فقط</option><option value="1">الإثنين فقط</option><option value="2">الثلاثاء فقط</option><option value="3">الأربعاء فقط</option><option value="4">الخميس فقط</option></select></div></div><label class="chk"><input type="checkbox" id="iaR" checked> استبدال الجدول الحالي</label><div class="btns"><button class="btn" id="iaOk">توزيع</button><button class="btn s" onclick="closeModal()">إلغاء</button></div>`);
  $('#iaOk').onclick=()=>{let d=$('#iaS').dataset.iso||todayIso();const n=Math.max(1,+$('#iaN').value||10);const dw=$('#iaD').value;if($('#iaR').checked)S.intSched=[];
    const who=(document.querySelector('#iaW .chip.on')||{}).dataset.v||'t';const used=new Set(S.intSched.flatMap(x=>x.tids));const list=sortedTeachers().filter(t=>!used.has(t.id)&&(who==='all'||(who==='t'?t.role==='معلم':t.role!=='معلم'))).map(t=>t.id);if(!list.length)return toast('لا يوجد منسوبون غير موزعين في هذه الفئة');
    const ok=x=>dw==='all'?isSchoolDay(x):isoToDate(x).getDay()===+dw;while(!ok(d))d=addDays(d,1);
    for(let i=0;i<list.length;i+=n){S.intSched.push({id:uid(),date:d,tids:list.slice(i,i+n)});d=addDays(d,1);while(!ok(d))d=addDays(d,1)}
    save();closeModal();render()}}

function planAutoVal(tid,k){switch(k){
  case 'tahy':{const v=S.orient.rows[tid];return v===1?1:v===0?0:null}
  case 'visit':return S.visits.some(v=>v.tid===tid&&isCurY(v)&&(v.el.some(x=>x[0])||v.tools.some(x=>x[0])))?1:null;
  case 'half':return (getEval(tid,'half')||evHasEvid(tid,'half'))?1:null;
  case 'idp':{const p=S.idp[tid];return p&&(p.start||p.custom)?1:null}
  case 'final':return (getEval(tid,'final')||evHasEvid(tid,'final'))?1:null;
  case 'int':{const i=S.interviews[tid];return i&&i.date?1:null}}return null}
function planVal(tid,k){const o=((S.splan[tid]||{}).ovr||{})[k];return o===undefined?planAutoVal(tid,k):(o===-1?null:o)}
function planAct(tid){const p=S.splan[tid]||{};if(p.act)return p.act;const v=S.visits.filter(v=>v.tid===tid&&v.date&&isCurY(v)).map(v=>v.date).sort()[0];return v||''}
const PLAN_SRC={tahy:'من صفحة التهيئة',visit:'من الزيارات الصفية',half:'من التقييم النصف سنوي وشواهده',idp:'من خطة التطوير الفردية',final:'من التقييم النهائي وشواهده',int:'من محضر المقابلة',goals:'يدوي'};
PAGES.plan=function(){const list=planList();let done=0;list.forEach(t=>{if(planVal(t.id,'visit')===1)done++});
  const prog=PLAN_ITEMS.map(([k,n])=>[n,list.filter(t=>planVal(t.id,k)===1).length]);
  let h=topBar(`<div class="card" style="padding:10px"><div class="vcard"><b>نُفذت ${done} زيارة من ${list.length}</b><span class="badge">${list.length?Math.round(done/list.length*100):0}%</span></div><div class="bar" style="margin-top:6px"><i style="width:${list.length?done/list.length*100:0}%"></i></div>
   <div class="btns"><button class="btn sm" onclick="planGen()">⚡ توليد مواعيد مقترحة</button><button class="btn o sm" onclick="printDoc(docPlan(),'landscape')">🖨️ طباعة الخطة الإشرافية</button><button class="btn s sm" onclick="go('orient')">🤝 التهيئة</button></div></div>`);
  h+=`<details class="card" style="padding:10px 14px"><summary style="font-size:14px">📊 نسب الإنجاز وطريقة الربط</summary><div style="margin-top:8px">${prog.map(([n,c])=>`<div style="margin:5px 0"><div class="vcard"><span class="mu">${n}</span><b>${c} / ${list.length}</b></div><div class="bar"><i style="width:${list.length?c/list.length*100:0}%"></i></div></div>`).join('')}</div><p class="mu" style="line-height:1.7">البند المُنجز يظهر بالأخضر، وغير المُنجز بالأحمر. تتحول البنود للأخضر تلقائياً عند إنجازها في أقسامها (التهيئة، الزيارات، التقييم النصفي والنهائي وشواهدهما، IDP، المقابلة). ويمكنك الضغط على أي بند لتغييره يدوياً (يظهر بجانبه ✎)، والضغط مرة أخرى يعيده للوضع التلقائي.</p></details><div class="card list" style="padding:4px 8px">`;
  h+=list.map(t=>{const p=planRec(t.id);const act=planAct(t.id);
    return `<div style="padding:10px 0;border-bottom:1px solid var(--bd)"><div class="vcard"><b>${esc(t.name)}</b><span class="mu">${esc(t.spec)}</span></div><div class="row" style="margin:6px 0"><div><label class="f">الموعد المقترح</label>${dateIn('pp'+t.id,p.prop,`planRec('${t.id}').prop=iso;save()`)}</div><div><label class="f">الموعد الفعلي ${!p.act&&act?'(من الزيارة)':''}</label>${dateIn('pa'+t.id,act,`planRec('${t.id}').act=iso;save()`)}</div></div>
    <div class="chips" id="pc_${t.id}">${planChips(t.id)}</div><input placeholder="ملاحظات" value="${esc(p.note||'')}" style="margin-top:6px" oninput="planRec('${t.id}').note=this.value;saveSoon()"></div>`}).join('')||'<div class="empty">لا يوجد معلمون</div>';
  setView('الخطة الإشرافية',h+'</div>');
};
function planChips(tid){const o=(S.splan[tid]||{}).ovr||{};return PLAN_ITEMS.map(([k,n])=>{const v=planVal(tid,k);return `<span class="chip wide plc ${v===1?'pon':'poff'}" title="${PLAN_SRC[k]}" onclick="planTap('${tid}','${k}')">${n}${o[k]!==undefined?' ✎':''}</span>`}).join('')}
function planTap(tid,k){const p=planRec(tid);p.ovr=p.ovr||{};const cur=planVal(tid,k);const auto=planAutoVal(tid,k);
  let nx=k==='tahy'?(cur===1?0:cur===0?null:1):(cur===1?null:1);
  if(nx===auto)delete p.ovr[k];else p.ovr[k]=nx===null?-1:nx;
  save();const el=$('#pc_'+tid);if(el)el.innerHTML=planChips(tid)}
function planGen(){const W=calWeeks();const st=W.length?W[0].start:todayIso();
  openModal(`<h3>توليد مواعيد الزيارات المقترحة</h3><p class="mu" style="line-height:1.7">${W.length?'تُؤخذ الأيام من «الأسابيع الدراسية» مع تخطي الإجازات.':'لم تُضبط «الأسابيع الدراسية» بعد، فسيعتمد التوليد على أيام الأحد–الخميس. يُفضّل ضبطها أولاً.'}</p><label class="f">تاريخ البداية</label>${dateIn('paS',nextSchoolDay(st>todayIso()?st:todayIso()),'')}<div class="row" style="margin-top:8px"><div><label class="f">عدد الزيارات في اليوم</label><input type="number" id="paN" value="1" min="1"></div></div><label class="chk"><input type="checkbox" id="paK" checked> عدم تغيير المواعيد المدخلة مسبقاً</label><div class="btns"><button class="btn" id="paOk">توليد</button>${W.length?'':`<button class="btn s" onclick="closeModal();go('weeks')">📆 ضبط الأسابيع</button>`}<button class="btn s" onclick="closeModal()">إلغاء</button></div>`);
  $('#paOk').onclick=()=>{let d=nextSchoolDay($('#paS').dataset.iso||todayIso());const n=Math.max(1,+$('#paN').value||1);const keep=$('#paK').checked;let c=0;
    planList().filter(t=>t.role==='معلم').forEach(t=>{const p=planRec(t.id);if(keep&&p.prop)return;p.prop=d;if(++c%n===0)d=nextSchoolDay(addDays(d,1))});save();closeModal();render();toast('تم توليد المواعيد')}}

/* ================= ORIENTATION ================= */
function orientList(){return sortedTeachers().filter(t=>t.role==='معلم')}
PAGES.orient=function(){const L=orientList();const R=S.orient.rows;const a=L.filter(t=>R[t.id]===1).length,b=L.filter(t=>R[t.id]===0).length;
  let h=topBar(`<div class="card" style="padding:10px"><div class="row"><div><label class="f">تاريخ لقاء التهيئة</label>${dateIn('orD',S.orient.date,'S.orient.date=iso;save()')}</div></div><div class="mu" style="margin-top:6px">حضر: <b style="color:var(--grn)">${a}</b> · لم يحضر: <b style="color:var(--red)">${b}</b> · لم يُرصد: ${L.length-a-b}</div>
   <div class="btns"><button class="btn s sm" onclick="orAll(1)">✓ الكل حضر</button><button class="btn s sm" onclick="orAll(null)">مسح</button><button class="btn o sm" onclick="printDoc(docOrient())">🖨️ طباعة الكشف</button><button class="btn s sm" onclick="go('plan')">🧭 الخطة الإشرافية</button></div></div>`);
  h+=`<div class="card list" style="padding:4px 8px">${L.map(t=>{const v=R[t.id];return `<div class="it" style="cursor:default"><div class="grow"><b>${esc(t.name)}</b><div class="mu">${esc(t.spec)}</div></div><div class="chips" id="or_${t.id}" style="flex:0 0 auto"><span class="chip wide ok ${v===1?'on':''}" onclick="orSet('${t.id}',1)">حضر</span><span class="chip wide no ${v===0?'on':''}" onclick="orSet('${t.id}',0)">لم يحضر</span></div></div>`}).join('')}</div>`;
  setView('التهيئة',h)};
function orSet(tid,v){const R=S.orient.rows;if(R[tid]===v)delete R[tid];else R[tid]=v;save();const y=scrollY;render();scrollTo(0,y)}
function orAll(v){orientList().forEach(t=>{if(v==null)delete S.orient.rows[t.id];else S.orient.rows[t.id]=v});save();render()}

/* ================= SCHOOL WEEKS ================= */
const ORD=['','الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر','الحادي عشر','الثاني عشر','الثالث عشر','الرابع عشر','الخامس عشر','السادس عشر','السابع عشر','الثامن عشر','التاسع عشر','العشرون','الحادي والعشرون','الثاني والعشرون','الثالث والعشرون','الرابع والعشرون','الخامس والعشرون','السادس والعشرون'];
PAGES.weeks=function(tt){tt=tt==='2'?2:1;const W=S.cal['t'+tt];window._wt=tt;const NUM=wkNums(W);const study=NUM.filter(Boolean).length;
  let h=topBar(`<div class="row" style="gap:6px;align-items:center"><button class="btn s sm" style="flex:0 0 auto" onclick="go('home')">🏠</button><div class="tabs" style="margin:0;flex:1 1 auto">${[1,2].map(k=>`<div class="tab ${k===tt?'on':''}" onclick="go('weeks/${k}',1)">الفترة ${k===1?'الأولى':'الثانية'} (${wkNums(S.cal['t'+k]).filter(Boolean).length} أسبوع)</div>`).join('')}</div></div>
   ${W.length?`<div class="btns" style="margin-top:6px"><button class="btn sm" onclick="wkAdd()">＋ إضافة أسبوع</button><button class="btn r sm" onclick="confirmBox('حذف كل أسابيع هذه الفترة؟',()=>{S.cal['t'+_wt]=[];syncSem();save();render()})">🗑️ حذف الكل</button><span class="mu" style="align-self:center">${study} أسبوع دراسي${W.length>study?' + '+(W.length-study)+' إجازة':''}</span></div>`:''}`)+`
   <div class="card" style="padding:10px"><div class="row" style="align-items:flex-end"><div><label class="f">أحد الأسبوع الأول</label>${dateIn('wkS',W[0]&&W[0].start||'',`wkFirst(iso)`)}</div><div style="flex:0 0 110px"><label class="f">عدد الأسابيع</label><select id="wkN">${Array.from({length:9},(_,k)=>18+k).map(n=>`<option ${n===(W.length>=18&&W.length<=26?W.length:18)?'selected':''}>${n}</option>`).join('')}</select></div><button class="btn" style="flex:0 0 auto" onclick="wkGen()">⚡ توليد</button></div>
   <div class="mu" style="margin-top:6px;line-height:1.7">اضغط على اليوم لجعله إجازة (أحمر). ⛔ يجعل الأسبوع كله إجازة فلا يأخذ رقماً، ويُعاد ترقيم الأسابيع بعده تلقائياً.</div></div>`;
  if(!W.length)h+=`<div class="card empty">اختر تاريخ يوم الأحد للأسبوع الأول ثم اضغط «توليد» لإنشاء أسابيع الفترة الدراسية.</div>`;
  h+=W.map((w,i)=>{const off=w.off||[];const hol=isHolWeek(w);return `<div class="wrow" style="${hol?'background:#fdf0ef':''}"><div class="wrh"><div><b>${hol?'🏖️ أسبوع إجازة':'الأسبوع '+(ORD[NUM[i]]||NUM[i])}</b> <span class="mu">${hStr(w.start)} — ${hStr(addDays(w.start,4))}</span></div><div class="row" style="flex:0 0 auto;gap:4px"><button class="btn s sm" title="${hol?'إلغاء الإجازة':'أسبوع إجازة'}" onclick="wkAllOff(${i})">${hol?'↩':'⛔'}</button><button class="btn r sm" title="حذف الأسبوع" onclick="wkDel(${i})">✕</button></div></div>
    <div class="chips">${DAYS.map((d,k)=>`<span class="chip wide wday ${off[k]?'woff':'won'}" onclick="wkDay(${i},${k})">${d}<small style="display:block;font-weight:500;font-size:11px">${hStr(addDays(w.start,k),true).slice(5)}</small></span>`).join('')}</div></div>`}).join('');
  setView('الأسابيع الدراسية',h)};
function wkLabel(W,i){const N=wkNums(W);return N[i]?'الأسبوع '+(ORD[N[i]]||N[i]):'أسبوع الإجازة ('+hStr(W[i].start)+')'}
function wkFirst(iso){if(!iso)return;const d=isoToDate(iso);if(d.getDay()!==0){d.setDate(d.getDate()-d.getDay());toast('تم ضبطه على يوم الأحد: '+hStr(dateToIso(d)));$('#wkS').dataset.iso=dateToIso(d);$('#wkS').value=hStr(dateToIso(d))}}
function wkGen(){const st=$('#wkS').dataset.iso;if(!st)return toast('اختر تاريخ الأحد للأسبوع الأول');const n=+$('#wkN').value;const W=S.cal['t'+_wt];
  const doit=()=>{S.cal['t'+_wt]=Array.from({length:n},(_,i)=>({start:addDays(st,i*7),off:[false,false,false,false,false]}));syncSem();save();render();toast('تم توليد '+n+' أسبوعاً')};
  W.length?confirmBox('سيتم استبدال أسابيع هذه الفترة. متابعة؟',doit):doit()}
function wkAdd(){const W=S.cal['t'+_wt];if(W.length>=30)return toast('الحد الأقصى للأسابيع');
  const opts=[`<option value="0">قبل ${wkLabel(W,0)}</option>`,...W.slice(0,-1).map((w,i)=>`<option value="${i+1}">بين ${wkLabel(W,i)} و${wkLabel(W,i+1).replace('الأسبوع','الأسبوع')}</option>`),`<option value="${W.length}" selected>بعد ${wkLabel(W,W.length-1)} (في النهاية)</option>`];
  openModal(`<h3>＋ إضافة أسبوع</h3><label class="f">موضع الأسبوع الجديد</label><select id="wkP">${opts.join('')}</select><label class="chk" style="margin-top:8px"><input type="checkbox" id="wkH"> أسبوع إجازة (لا يأخذ رقماً)</label><p class="mu" style="line-height:1.7">تُزاح تواريخ الأسابيع التالية أسبوعاً عند الحاجة، ويُعاد الترقيم تلقائياً.</p><div class="btns"><button class="btn" id="wkOk">إضافة</button><button class="btn s" onclick="closeModal()">إلغاء</button></div>`);
  $('#wkOk').onclick=()=>{const p=+$('#wkP').value;const hol=$('#wkH').checked;const start=p===0?addDays(W[0].start,-7):addDays(W[p-1].start,7);
    W.splice(p,0,{start,off:[0,1,2,3,4].map(()=>hol)});for(let k=p+1;k<W.length;k++){if(W[k].start<=W[k-1].start)W[k].start=addDays(W[k-1].start,7)}
    syncSem();save();closeModal();const y=scrollY;render();scrollTo(0,y);toast('تمت إضافة الأسبوع')}}
function wkDel(i){confirmBox('حذف '+wkLabel(S.cal['t'+_wt],i)+'؟',()=>{S.cal['t'+_wt].splice(i,1);syncSem();save();const y=scrollY;render();scrollTo(0,y)})}
function wkDay(i,k){const w=S.cal['t'+_wt][i];w.off=w.off||[false,false,false,false,false];w.off[k]=!w.off[k];save();const y=scrollY;render();scrollTo(0,y)}
function wkAllOff(i){const w=S.cal['t'+_wt][i];const all=(w.off||[]).filter(Boolean).length===5;w.off=[0,1,2,3,4].map(()=>!all);save();const y=scrollY;render();scrollTo(0,y)}
function syncSem(){const a=S.cal.t1[0],b=S.cal.t2[0];S.school.sem1=a?a.start:S.school.sem1;S.school.sem2=b?b.start:S.school.sem2}

PAGES.att=function(wid){const W=S.att.weeks;let w=W.find(x=>x.id===wid)||W[W.length-1];
  let h=`<div class="card"><div class="row"><select onchange="go('att/'+this.value)">${W.map(x=>`<option value="${x.id}" ${w&&x.id===w.id?'selected':''}>${esc(x.title)}</option>`).join('')||'<option>لا توجد أسابيع</option>'}</select><div class="btns" style="margin:0;flex:0 0 auto"><button class="btn" onclick="attNew()">＋ أسبوع</button>${w?`<button class="btn r sm" onclick="confirmBox('حذف الأسبوع؟',()=>{S.att.weeks=S.att.weeks.filter(x=>x.id!=='${w.id}');save();go('att')})">✕</button>`:''}</div></div></div>`;
  if(!w)return setView('انتظام المعلمين',h+'<div class="empty">أضف أسبوعاً لبدء رصد الانتظام في دخول الحصص</div>');
  window._aw=w;const list=sortedTeachers().filter(t=>t.role==='معلم');
  h+=`<div class="card"><div class="btns" style="margin-top:0"><button class="btn s sm" onclick="attAll(1)">الكل منتظم ✓</button><button class="btn s sm" onclick="attAll(null)">مسح</button><button class="btn o sm" onclick="printDoc(docAtt('${w.id}'))">🖨️ طباعة</button></div><div class="mu" style="margin:6px 0">اضغط على اليوم للتبديل: ✓ منتظم ← × غير منتظم ← فارغ</div><div class="tblw"><table class="tbl"><tr><th>المعلم</th>${DAYS.map(d=>`<th>${d}</th>`).join('')}<th>النسبة</th></tr>`;
  h+=list.map(t=>{const r=w.rows[t.id]=w.rows[t.id]||[null,null,null,null,null];return `<tr><td class="r">${esc(t.name)}</td>${r.map((v,k)=>`<td><span class="tick ${v===1?'on':v===0?'x':''}" onclick="attT('${t.id}',${k},this)">${v===1?'✓':v===0?'×':''}</span></td>`).join('')}<td id="ap${t.id}">${attPct(r)}</td></tr>`}).join('');
  setView('انتظام المعلمين',h+'</table></div></div>');
};
function attPct(r){const f=r.filter(x=>x!=null);return f.length?Math.round(f.filter(x=>x===1).length/f.length*100)+'%':'—'}
function attT(tid,k,el){const r=_aw.rows[tid];r[k]=r[k]===1?0:r[k]===0?null:1;el.className='tick '+(r[k]===1?'on':r[k]===0?'x':'');el.textContent=r[k]===1?'✓':r[k]===0?'×':'';$('#ap'+tid).textContent=attPct(r);save()}
function attAll(v){sortedTeachers().forEach(t=>_aw.rows[t.id]=[v,v,v,v,v]);save();render()}
function attNew(){const wk=weekOf(todayIso());const ord=['','الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر','الحادي عشر','الثاني عشر','الثالث عشر','الرابع عشر','الخامس عشر','السادس عشر','السابع عشر','الثامن عشر'];
  openModal(`<h3>أسبوع جديد</h3><label class="f">عنوان الأسبوع</label><input id="awT" value="الأسبوع ${ord[wk]||wk||''}"><label class="f" style="margin-top:8px">تاريخ بداية الأسبوع (الأحد)</label>${dateIn('awD',todayIso(),'')}<div class="btns"><button class="btn" id="awOk">إضافة</button></div>`);
  $('#awOk').onclick=()=>{const w={id:uid(),title:$('#awT').value||'أسبوع',start:$('#awD').dataset.iso,rows:{}};S.att.weeks.push(w);save();closeModal();go('att/'+w.id)}}

    h+=L.map(([d,i])=>`<tr style="${d.date===todayIso()?'background:#fff7e0':''}"><td>${dateIn('dd'+i,d.date,`S.duty[${i}].date=iso;save();render()`)}</td><td>${dayName(d.date)}</td><td>${tSelect('dt'+i,d.tid,`S.duty[${i}].tid=this.value;save()`,{empty:'—'})}</td><td><button class="btn r sm" onclick="S.duty.splice(${i},1);save();render()">✕</button></td></tr>`).join('');
    h+='</table></div></div>'}

function loadScript(src){return new Promise((ok,no)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('تعذر التحميل — تحقق من اتصال الإنترنت'));document.head.appendChild(s)})}
async function pvShare(){const btn=$('#pvShareBtn');const old=btn.textContent;btn.disabled=true;btn.textContent='⏳ تجهيز...';
  try{await loadScript('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js');await loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js');
    const land=_pv.orient==='landscape';const W=land?1123:794,H=land?794:1123,M=34;
    const host=document.createElement('div');host.style.cssText='position:fixed;left:-30000px;top:0;background:#fff';document.body.appendChild(host);
    const pdf=new jspdf.jsPDF({orientation:land?'l':'p',unit:'mm',format:'a4'});const pw=land?297:210,phh=land?210:297;
    const tmp=document.createElement('div');tmp.innerHTML=_pv.html;const docs=[...tmp.querySelectorAll('.doc')];
    for(let k=0;k<docs.length;k++){host.innerHTML='';const pg=document.createElement('div');pg.style.cssText=`width:${W}px;height:${H}px;padding:${M}px;box-sizing:border-box;background:#fff;overflow:hidden;font-size:12px;color:#000`;
      const d=docs[k].cloneNode(true);d.style.width='100%';pg.appendChild(d);host.appendChild(pg);
      const cv=await html2canvas(pg,{scale:2,backgroundColor:'#fff',useCORS:true});if(k)pdf.addPage();pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,pw,phh)}
    host.remove();const name=(_pv.title||'نموذج').replace(/[\\/:*?"<>|]/g,'')+'.pdf';const blob=pdf.output('blob');const file=new File([blob],name,{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name}).catch(e=>{if(e.name!=='AbortError')throw e})}else{dl(blob,name);toast('تم تنزيل الملف — المشاركة غير مدعومة في هذا المتصفح')}}

/* blocks: {h:html, keep:true} أو {tbl:true, cls, cg, thead, units:[html]} */
const PGS={portrait:{w:726,h:1046},landscape:{w:1054,h:718}};
function _measBox(w){let m=document.getElementById('meas');if(!m){m=document.createElement('div');m.id='meas';document.body.appendChild(m)}
  m.style.cssText=`position:absolute;left:-40000px;top:0;visibility:hidden;width:${w}px;font-size:12px;color:#000;line-height:normal`;return m}
function paged(o){const orient=o.orient||'portrait';const P=PGS[orient];const head=ph(o.title,o.sub)+(o.info||'');const tail=o.tail||'';const foot=pf();
  const m=_measBox(P.w);
  const mb=x=>`<div class="mb" style="display:flow-root">${x}</div>`;
  let html='<div class="doc">'+mb(head)+o.blocks.map(b=>b.tbl?mb(`<table class="pt ${b.cls||''}">${b.cg||''}<thead>${b.thead}</thead>${b.units.map(u=>`<tbody>${u}</tbody>`).join('')}</table>`):mb(b.h)).join('')+mb(tail)+mb(foot)+'</div>';
  m.innerHTML=html;const parts=[...m.querySelectorAll('.doc > .mb')];
  const headH=parts[0].offsetHeight;const footH=parts[parts.length-1].offsetHeight;const tailH=parts[parts.length-2].offsetHeight;
  const meas=o.blocks.map((b,k)=>{const el=parts[k+1];if(!b.tbl)return {h:el.offsetHeight};
    const th=el.querySelector('thead').offsetHeight;const tb=[...el.querySelectorAll('tbody')];const uh=tb.map(x=>x.offsetHeight);
    const trs=tb.map(x=>[...x.children].map(tr=>tr.offsetHeight));const extra=el.offsetHeight-th-uh.reduce((a,c)=>a+c,0);return {th:th+Math.max(0,extra),uh,trs}});
  const avail=P.h-headH-footH-8;const brk=new Set((o.breaks||[]).map(x=>x.join(':')));
  const pages=[];let cur={items:[],used:0};const np=()=>{pages.push(cur);cur={items:[],used:0}};
  o.blocks.forEach((b,bi)=>{const M=meas[bi];
    if(!b.tbl){if(cur.items.length&&cur.used+M.h>avail){let carry=null;const last=cur.items[cur.items.length-1];if(last&&!last.units&&o.blocks[last.bi].keep&&cur.items.length>1){cur.items.pop();cur.used-=meas[last.bi].h;carry=last}np();if(carry){cur.items.push(carry);cur.used+=meas[carry.bi].h}}cur.items.push({bi});cur.used+=M.h;return}
    let seg=null;b.units.forEach((u,k)=>{const need=(seg?0:M.th)+M.uh[k];
      if(cur.items.length&&(brk.has(bi+':'+k)||cur.used+need>avail)){let carry=null;if(!seg){const last=cur.items[cur.items.length-1];if(last&&last.bi!=null&&!o.blocks[last.bi].tbl&&o.blocks[last.bi].keep){cur.items.pop();cur.used-=meas[last.bi].h;carry=last}}
        np();seg=null;if(carry){cur.items.push(carry);cur.used+=meas[carry.bi].h}}
      if(!seg){seg={bi,units:[]};cur.items.push(seg);cur.used+=M.th}
      seg.units.push(k);cur.used+=M.uh[k]});});
  if(cur.used+tailH>avail){const last=cur.items[cur.items.length-1];
    if(last&&last.units&&last.units.length>=3){const mv=last.units.splice(-2);const M=meas[last.bi];cur.used-=mv.reduce((a,k)=>a+M.uh[k],0);np();cur.items.push({bi:last.bi,units:mv});cur.used+=M.th+mv.reduce((a,k)=>a+M.uh[k],0)}
    else np()}
  cur.tail=true;pages.push(cur);
  const build=(pg,add)=>{const body=pg.items.map(it=>{const b=o.blocks[it.bi];if(!it.units)return b.h;const M=meas[it.bi];
      return `<table class="pt ${b.cls||''}">${b.cg||''}<thead>${b.thead}</thead>${it.units.map(k=>{let n=0;const hs=M.trs[k];return '<tbody>'+(add>0?b.units[k].replace(/<tr(?=[\s>])/g,()=>`<tr style="height:${Math.max(0,Math.floor(hs[n++]+add)-1)}px"`):b.units[k])+'</tbody>'}).join('')}</table>`}).join('');
    return `<div class="doc">${head}${body}${pg.tail?tail:''}${foot}</div>`};
  const lim=P.h-2;const mp=(pg,add)=>{m.innerHTML=build(pg,add);return m.firstElementChild.offsetHeight};
  for(let i=0;i<pages.length;i++){const pg=pages[i];let H=mp(pg,0);let g=0;
    while(H>lim&&g++<300){const last=pg.items[pg.items.length-1];if(!last)break;if(pg.items.length===1&&(!last.units||last.units.length<=1))break;
      let nx=pages[i+1];if(!nx){nx={items:[],used:0};pages.push(nx);if(pg.tail){nx.tail=true;pg.tail=false}}
      if(last.units){const k=last.units.pop();if(!last.units.length)pg.items.pop();const f=nx.items[0];if(f&&f.units&&f.bi===last.bi)f.units.unshift(k);else nx.items.unshift({bi:last.bi,units:[k]})}
      else{pg.items.pop();nx.items.unshift(last)}
      const l2=pg.items[pg.items.length-1];if(l2&&!l2.units&&o.blocks[l2.bi].keep&&pg.items.length>1){pg.items.pop();nx.items.unshift(l2)}
      H=mp(pg,0)}
    const lk=pg.items[pg.items.length-1];if(lk&&!lk.units&&o.blocks[lk.bi].keep&&pg.items.length>1&&pages[i+1]){pg.items.pop();pages[i+1].items.unshift(lk);H=mp(pg,0)}
    pg.H=H}
  const out=pages.map((pg,pi)=>{const isLast=pi===pages.length-1;let trTotal=0;pg.items.forEach(it=>{if(it.units)it.units.forEach(k=>trTotal+=meas[it.bi].trs[k].length)});
    let add=((!isLast||(o.fill&&pages.length===1))&&trTotal)?Math.min(Math.max(0,lim-pg.H)/trTotal,o.maxAdd||36):0;let h=build(pg,add);
    for(let it=0;it<4&&add>0;it++){m.innerHTML=h;const H=m.firstElementChild.offsetHeight;if(H<=lim)break;add=Math.max(0,add-(H-lim)/trTotal-0.5);h=build(pg,add)}
    return h});
  m.innerHTML='';return out.join('')}

  return paged({title:'متابعة أعمال المنسوبين حسب عناصر الأداء الوظيفي',sub:PER_NAME[per],orient:'landscape',blocks,tail:mgmtSigs()})}
function docSign(kind,subj){const L=sortedTeachers().filter(t=>kind==='all'||t.role==='معلم');const units=[];
  for(let i=0;i<L.length;i+=2){const c=k=>L[k]?`<td>${k+1}</td><td class="r">${esc(L[k].name)}</td><td></td>`:'<td></td><td></td><td></td>';units.push(tr(c(i)+c(i+1)))}
  const h='<th style="width:5%">م</th><th style="width:28%">الاسم</th><th style="width:17%">التوقيع</th>';
  return paged({title:kind==='all'?'كشف توقيع المعلمين والإداريين':'كشف توقيع المعلمين',info:`<div class="pinfo" style="grid-template-columns:1fr"><div style="font-size:13px"><b>الموضوع:</b> ${subj?esc(subj):'....................................................................................................'}</div></div>`,blocks:[{tbl:true,cls:'big',thead:`<tr>${h+h}</tr>`,units}],tail:'',maxAdd:20})}

/* ================= EXCEL EXPORT (SpreadsheetML) ================= */
function exportExcel(){const x=v=>String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const sheet=(name,rows)=>`<Worksheet ss:Name="${x(name)}"><Table>${rows.map((r,i)=>`<Row>${r.map(c=>`<Cell${i===0?' ss:StyleID="h"':''}><Data ss:Type="${typeof c==='number'&&isFinite(c)?'Number':'String'}">${x(typeof c==='number'?+c.toFixed(4):c)}</Data></Cell>`).join('')}</Row>`).join('')}</Table><WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel"><DisplayRightToLeft/></WorksheetOptions></Worksheet>`;
  const L=sortedTeachers();const sh=[];
  sh.push(sheet('المعلمون',[['م','الاسم','التخصص','الفئة','الهوية','الجوال'],...L.map((t,i)=>[i+1,t.name,t.spec,t.role,t.nid||'',t.phone||''])]));
  ['half','final'].forEach(p=>FORM_KEYS.forEach(k=>{const F=FORMS[k];const LL=L.filter(t=>{const c=getEval(t.id,p);return c?c.form===k:(k===formKeyOf(t.id))});if(!LL.length)return;
    sh.push(sheet((PER_NAME[p]+' - '+FORM_CHIP[k]).replace(/[\/?*\[\]:]/g,'-').slice(0,31),[['الاسم','التخصص','الفئة',...F.stds.map(s=>s.name+' ('+Math.round(s.w*100)+'%)'),'التقدير العام من 5','نسبة التحقق %','المستوى'],...LL.map(t=>{const c=getEval(t.id,p);return [t.name,t.spec,t.role,...F.stds.map((s,j)=>c&&c.per[j]?c.per[j].score:''),c?c.grade:'',c?Math.round(c.pct*10)/10:'',c?evCls(c):'']})]))}));
  sh.push(sheet('الزيارات',[['المعلم','الزيارة','التاريخ','اليوم','الصف','موضوع الدرس','مميز','متوسط','ضعيف','النسبة','الدعم المقدم','التوصيات'],...S.visits.map(v=>{const c=[0,0,0,0];v.el.forEach(e=>c[e[0]]++);return [tName(v.tid),VNUM[v.num]||v.num,hStr(v.date),dayName(v.date),v.cls,v.topic,c[1],c[2],c[3],visitPct(v),joinTxt(visitSupport(v),v.notes),joinTxt(visitRecs(v),v.recs)]})]));
  sh.push(sheet('الخطة الإشرافية',[['المعلم','الموعد المقترح','الموعد الفعلي',...PLAN_COLS,'ملاحظات'],...planList().map(t=>{const p=S.splan[t.id]||{};return [t.name,hStr(p.prop),hStr(planAct(t.id)),...PLAN_ITEMS.map(([k])=>{const v=planVal(t.id,k);return v===1?'✓':v===0?'×':''}),p.note||'']})]));
  sh.push(sheet('المناوبة',[['التاريخ','اليوم','المناوب'],...S.duty.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(d=>[hStr(d.date),dayName(d.date),tName(d.tid)])]));
  sh.push(sheet('الإشراف',[['الأسبوع','المشرف'],...S.sup.slice().sort((a,b)=>a.week-b.week).map(d=>[+d.week,tName(d.tid)])]));
  const xml=`<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Styles><Style ss:ID="h"><Font ss:Bold="1"/><Interior ss:Color="#E3EFEB" ss:Pattern="Solid"/></Style></Styles>${sh.join('')}</Workbook>`;
  dl(new Blob([xml],{type:'application/vnd.ms-excel'}),'سجل_المعلمين_'+hStr(todayIso(),true).replace(/\//g,'-')+'.xls');toast('تم التصدير')}

/* ================= DROPBOX SYNC ================= */
const DBX_FILE='/sijil_almuallimin.json';
const dbxRedirect=()=>location.origin+location.pathname;
const b64u=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
function dbxDot(s){const d=$('#syncDot');if(d)d.className=s||''}
function dbxCard(){const d=S.dbx||{};const on=!!d.rt;
  return `<div class="card"><h3>☁️ المزامنة التلقائية عبر Dropbox</h3>${on?`<p>✅ مرتبط${d.last?' — آخر مزامنة: '+new Date(d.last).toLocaleString('ar-SA-u-ca-islamic-umalqura'):''}</p><label class="chk"><input type="checkbox" ${d.auto!==false?'checked':''} onchange="S.dbx.auto=this.checked;save()"> مزامنة تلقائية عند كل حفظ وعند الفتح</label><div class="btns"><button class="btn" onclick="dbxSync(true)">🔄 مزامنة الآن</button><button class="btn s" onclick="dbxPull(true)">⬇️ جلب نسخة السحابة</button><button class="btn r" onclick="confirmBox('فصل الربط مع Dropbox؟',()=>{S.dbx={key:S.dbx.key};save();render()})">فصل</button></div>`
  :`<p class="mu" style="line-height:1.7">تعمل المزامنة عندما يكون البرنامج منشوراً على رابط https (مثل GitHub Pages). استخدم مفتاح تطبيق Dropbox الخاص بك (App key) وأضف في إعدادات تطبيقك في Dropbox عنوان إعادة التوجيه التالي:<br><code style="direction:ltr;display:block;background:#f3f6f5;padding:6px;border-radius:6px;word-break:break-all">${esc(dbxRedirect())}</code>الملف في Dropbox: <code>${DBX_FILE}</code></p><label class="f">App key</label><input id="dbxK" style="direction:ltr" value="${esc(d.key||'')}"><div class="btns"><button class="btn" onclick="dbxConnect()">ربط Dropbox</button></div>`}</div>`}
async function dbxConnect(){const key=$('#dbxK').value.trim();if(!key)return toast('أدخل App key');if(!/^https:/.test(location.protocol))return toast('يجب فتح البرنامج من رابط https');
  S.dbx={key};localStorage.setItem(KEY,JSON.stringify(S));const ver=b64u(crypto.getRandomValues(new Uint8Array(32)));localStorage.setItem('smu_dbx_ver',ver);
  const ch=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(ver)));
  location.href='https://www.dropbox.com/oauth2/authorize?'+new URLSearchParams({client_id:key,response_type:'code',code_challenge:ch,code_challenge_method:'S256',token_access_type:'offline',redirect_uri:dbxRedirect()})}
async function dbxHandleRedirect(){const q=new URLSearchParams(location.search);const code=q.get('code');if(!code||!S.dbx||!S.dbx.key)return false;
  history.replaceState(null,'',location.pathname+location.hash);
  try{const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',body:new URLSearchParams({code,grant_type:'authorization_code',code_verifier:localStorage.getItem('smu_dbx_ver')||'',client_id:S.dbx.key,redirect_uri:dbxRedirect()})});
    const j=await r.json();if(!j.refresh_token)throw new Error(j.error_description||'فشل الربط');S.dbx.rt=j.refresh_token;S.dbx.at=j.access_token;S.dbx.exp=Date.now()+(j.expires_in-60)*1000;S.dbx.auto=true;localStorage.setItem(KEY,JSON.stringify(S));toast('تم ربط Dropbox — جارٍ فحص السحابة…');await dbxFirst();return true}
  catch(e){toast('تعذر ربط Dropbox: '+e.message);return false}}
async function dbxToken(){const d=S.dbx;if(d.at&&d.exp>Date.now())return d.at;
  const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',body:new URLSearchParams({grant_type:'refresh_token',refresh_token:d.rt,client_id:d.key})});const j=await r.json();if(!j.access_token)throw new Error('انتهت صلاحية الربط');d.at=j.access_token;d.exp=Date.now()+(j.expires_in-60)*1000;return d.at}
async function dbxDownload(){const t=await dbxToken();const r=await fetch('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{Authorization:'Bearer '+t,'Dropbox-API-Arg':JSON.stringify({path:DBX_FILE})}});if(r.status===409)return null;if(!r.ok)throw new Error('download '+r.status);return JSON.parse(await r.text())}
async function dbxUpload(){const t=await dbxToken();const body=JSON.stringify(Object.assign({},S,{dbx:undefined}));const r=await fetch('https://content.dropboxapi.com/2/files/upload',{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/octet-stream','Dropbox-API-Arg':JSON.stringify({path:DBX_FILE,mode:'overwrite',mute:true})},body});if(!r.ok)throw new Error('upload '+r.status)}
let dbxBusy=false,dbxT;
function dbxQueue(){if(!S.dbx||!S.dbx.rt||S.dbx.auto===false)return;clearTimeout(dbxT);dbxT=setTimeout(()=>dbxSync(false),2500)}
async function dbxSync(manual){if(!S.dbx||!S.dbx.rt||dbxBusy)return;if(!navigator.onLine){dbxDot('err');return}dbxBusy=true;dbxDot('busy');
  try{const rem=await dbxDownload();
    if(hasData(rem)&&(!hasData(S)||(rem.updated||0)>(S.updated||0))){const d=S.dbx;S=fix(rem);S.dbx=d;localStorage.setItem(KEY,JSON.stringify(S));render();if(manual)toast('تم جلب أحدث نسخة من السحابة')}
    else if(hasData(S)&&(!rem||!hasData(rem)||(rem.updated||0)<(S.updated||0))){await dbxUpload();if(manual)toast('تم رفع البيانات إلى السحابة')}
    else if(manual)toast('البيانات متطابقة');
    S.dbx.last=Date.now();localStorage.setItem(KEY,JSON.stringify(S));dbxDot('on')}
  catch(e){dbxDot('err');if(manual)toast('تعذرت المزامنة: '+e.message)}finally{dbxBusy=false}}
const hasData=x=>!!(x&&x.teachers&&x.teachers.length);
function dbxTake(rem,msg){const d=S.dbx;S=fix(rem);S.dbx=d;S.dbx.last=Date.now();localStorage.setItem(KEY,JSON.stringify(S));dbxDot('on');go('home',1);render();toast(msg||'تم جلب بياناتك من السحابة')}
async function dbxFirst(){dbxDot('busy');try{const rem=await dbxDownload();
  if(hasData(rem)&&!hasData(S))return dbxTake(rem);
  if(hasData(rem)&&hasData(S)){dbxDot('on');openModal(`<h3>☁️ توجد بيانات في السحابة وفي هذا الجهاز</h3><p class="mu" style="line-height:1.8">السحابة: ${rem.teachers.length} منسوب، ${(rem.visits||[]).length} زيارة.<br>هذا الجهاز: ${S.teachers.length} منسوب، ${(S.visits||[]).length} زيارة.<br>أيهما تريد اعتماده؟ النسخة الأخرى ستُستبدل.</p><div class="btns"><button class="btn" id="dfC">⬇️ اعتماد نسخة السحابة</button><button class="btn s" id="dfL">⬆️ اعتماد بيانات هذا الجهاز</button></div>`);
    $('#dfC').onclick=()=>{closeModal();dbxTake(rem)};$('#dfL').onclick=async()=>{closeModal();try{await dbxUpload();S.dbx.last=Date.now();localStorage.setItem(KEY,JSON.stringify(S));dbxDot('on');toast('تم رفع بيانات هذا الجهاز إلى السحابة')}catch(e){dbxDot('err');toast(e.message)}};return}
  if(hasData(S)){await dbxUpload();toast('تم رفع بياناتك إلى السحابة')}else toast('السحابة فارغة وهذا الجهاز فارغ');S.dbx.last=Date.now();localStorage.setItem(KEY,JSON.stringify(S));dbxDot('on')}
 catch(e){dbxDot('err');toast('تعذر فحص السحابة: '+e.message)}}
async function dbxPull(){try{const rem=await dbxDownload();if(!rem)return toast('لا توجد نسخة في السحابة');confirmBox('استبدال بيانات هذا الجهاز بنسخة السحابة؟',()=>{const d=S.dbx;S=fix(rem);S.dbx=d;localStorage.setItem(KEY,JSON.stringify(S));go('home');toast('تم')})}catch(e){toast(e.message)}}

/* ================= BOOT ================= */
(function(){try{const base=location.href.split('#')[0].split('?')[0];
  const m={name:'سجل المعلمين',short_name:'سجل المعلمين',description:'متابعة أداء المعلمين والإداريين',lang:'ar',dir:'rtl',id:base,start_url:base,scope:base.replace(/[^/]*$/,''),display:'standalone',background_color:'#ffffff',theme_color:'#0f5c4d',
   icons:[{src:APPICON,sizes:'512x512',type:'image/png',purpose:'any'},{src:APPICON,sizes:'192x192',type:'image/png',purpose:'any'}]};
  $('#mf').href='data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(m));$('#fav').href=APPICON;$('#ati').href=APPICON}catch(e){}})();
(async function boot(){render();const handled=await dbxHandleRedirect();if(!handled&&S.dbx&&S.dbx.rt&&S.dbx.auto!==false){dbxDot('on');dbxSync(false)}
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.dbx&&S.dbx.rt&&S.dbx.auto!==false)dbxSync(false)})})();

</script>
